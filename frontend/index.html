<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Aazhi - Premium Kids Wear | Tiruppur Cotton Clothing</title>
    <meta name="description" content="Premium Tiruppur cotton kids wear. Made for play, priced for parents. Direct from the textile capital of India to your doorstep." />
    <meta name="author" content="Aazhi" />

    <meta property="og:title" content="Aazhi - Premium Kids Wear | Tiruppur Cotton Clothing" />
    <meta property="og:description" content="Premium Tiruppur cotton kids wear. Made for play, priced for parents." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theaazhi.com" />
    <meta property="og:image" content="https://theaazhi.com/assets/banner1-optimized.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@theaazhi" />
    <meta name="twitter:image" content="https://theaazhi.com/assets/banner1-optimized.webp" />

    <!-- ============================================ -->
    <!-- 🚀 PERFORMANCE OPTIMIZATIONS                -->
    <!-- ============================================ -->
    
    <!-- 1. Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- 2. Preconnect to your domain for faster loading -->
    <link rel="preconnect" href="https://theaazhi.com" />
    <link rel="dns-prefetch" href="https://theaazhi.com" />
    
    <!-- 3. ⭐⭐⭐ LCP IMAGE PRELOAD - HIGHEST PRIORITY ⭐⭐⭐ -->
    <!-- 
      IMPORTANT: After building your app, check dist/assets/ for the actual filename with hash.
      Replace "banner1-optimized-D0a-p9em.webp" with your actual built filename.
      Example: /assets/banner1-optimized-abc123.webp
    -->
    <link 
      rel="preload" 
      href="/assets/banner1-optimized-D0a-p9em.webp" 
      as="image" 
      fetchpriority="high"
      type="image/webp"
    />
    
    <!-- 4. Preload critical font (optional) -->
    <link 
      rel="preload" 
      href="https://fonts.gstatic.com/s/cormorantgaramond/v16/...woff2" 
      as="font" 
      type="font/woff2" 
      crossorigin="anonymous"
    />
    
    <!-- 5. Critical CSS Inlined -->
    <style>
      /* Critical CSS for above-the-fold content */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(ellipse at 20% 25%, #f5efff 0%, #e8f0fe 45%, #faf5ff 70%, #ffffff 100%);
        background-attachment: fixed;
        min-height: 100vh;
        color: #1e1b4b;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      @media (max-width: 768px) {
        body {
          background: radial-gradient(ellipse at 20% 25%, #f5efff 0%, #e8f0fe 45%, #faf5ff 70%, #ffffff 100%);
          background-attachment: fixed;
        }
      }
      
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Nunito Sans', sans-serif;
        color: #6d28d9;
        opacity: 0;
        animation: fadeIn 0.3s ease-in forwards;
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
    
    <!-- 6. Load Google Fonts asynchronously -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Nunito+Sans:wght@300;400;500;600;700;800&display=swap" 
      rel="stylesheet" 
      media="print" 
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link 
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Nunito+Sans:wght@300;400;500;600;700;800&display=swap" 
        rel="stylesheet"
      />
    </noscript>
    
    <!-- 7. Load main CSS asynchronously -->
    <link 
      rel="preload" 
      href="/assets/index-brfmterx.css" 
      as="style" 
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="/assets/index-brfmterx.css" />
    </noscript>
    
    <!-- 8. Fallback if CSS fails to load -->
    <noscript>
      <style>
        body { background: #f5efff; }
      </style>
    </noscript>
    
    <!-- ============================================ -->
    <!-- END PERFORMANCE OPTIMIZATIONS                -->
    <!-- ============================================ -->
  </head>

  <body>
    <div id="root">
      <div class="app-loading">
        <span>Loading Aazhi...</span>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
